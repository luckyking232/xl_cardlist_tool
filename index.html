<!-- index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夯拉排位 - 纯图片版</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
<div class="toolbar">
  <button id="resetBtn" class="btn-glass">重置</button>
  <button id="addTierBtn" class="btn-glass">添加等级行</button>
  <button id="fullscreenBtn" class="btn-glass">全屏</button>
  <button id="bgBtn" class="btn-glass">🎨 选择背景</button>
  <button id="exportBtn" class="btn-glass">📷 导出图片</button>
  <!-- 👇 新增按钮 -->
  <button id="saveBtn" class="btn-glass">💾 保存进度</button>
  <button id="exportSaveBtn" class="btn-glass">📤 导出进度文件</button>
  <button id="importSaveBtn" class="btn-glass">📥 导入进度文件</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>

    <div class="tips">
      💡 点击等级行名称可编辑样式；点击等级行空白区域可添加角色；建议使用电脑操作以获得最佳体验。
    </div>

    <div id="tierContainer"></div>

    <!-- 编辑等级行弹窗 -->
    <div id="editTierModal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h3>编辑等级行</h3>
        <label>名称：<input type="text" id="editName"></label>
        <label>背景色：<input type="color" id="editBgColor"></label>
        <label>文字颜色：<input type="color" id="editTextColor"></label>
        <div class="modal-buttons">
          <button id="saveTierBtn" class="btn-glass">保存</button>
          <button id="cancelTierBtn" class="btn-glass">取消</button>
        </div>
      </div>
    </div>

    <!-- 选择角色弹窗 -->
    <div id="pickerModal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-content picker-modal">
        <h3>选择角色</h3>
        <div class="filter-bar">
          <span class="filter-label">筛选：</span>
          <div id="filterStars" class="filter-group"></div>
          <div id="filterProfs" class="filter-group"></div>
          <div id="filterElems" class="filter-group"></div>
          <button id="clearFilterBtn" class="btn-glass btn-small">清除筛选</button>
        </div>
        <div id="imageGrid" class="image-grid"></div>
        <div class="modal-buttons">
          <button id="confirmPickBtn" class="btn-glass">确定</button>
          <button id="cancelPickBtn" class="btn-glass">取消</button>
        </div>
      </div>
    </div>

    <!-- 选择背景弹窗 -->
    <div id="bgModal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-content picker-modal">
        <h3>选择背景</h3>
        <!-- 视图大小切换按钮 -->
        <div class="view-toggle">
          <button data-size="small">小</button>
          <button data-size="medium" class="active">中</button>
          <button data-size="large">大</button>
        </div>
        <div id="bgGrid" class="image-grid view-medium"></div>
        <div class="modal-buttons">
          <button id="resetBgBtn" class="btn-glass">恢复默认</button>
          <button id="cancelBgBtn" class="btn-glass">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./lib/sortable.min.js"></script>
  <script src="./lib/html2canvas.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
